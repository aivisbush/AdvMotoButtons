# Releases, driven by tags on any branch:
#   <board>/v<version>          production firmware, e.g. esp32c3-oled/v2.4.0
#   <board>/v<version>-beta.N   beta firmware,       e.g. esp32c3-oled/v2.4.1-beta.1
#   app/v<version>              Android app,         e.g. app/v1.3
# Firmware is built from the tagged commit with the board's entry in release.json and
# checked against the tag. Boards with "ota": true are added to the gh-pages branch (the
# GitHub Pages site, where the phone app finds them); every build is attached to a
# GitHub Release (nRF52840: the .zip DFU package and the .hex). The app needs the secrets ANDROID_KEYSTORE_BASE64 and
# ANDROID_KEYSTORE_PASSWORD (see README, Publishing releases).
name: Release

on:
  push:
    tags: ['*/v*']

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  firmware:
    if: ${{ !startsWith(github.ref_name, 'app/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read tag and release.json
        id: meta
        run: |
          tag="${GITHUB_REF_NAME}"
          board="${tag%%/v*}"
          version="${tag#*/v}"
          channel=prod
          case "$version" in *-beta*) channel=beta ;; esac
          entry=$(jq -c --arg b "$board" '.boards[$b] // empty' release.json)
          if [ -z "$entry" ]; then
            echo "::error::Board '$board' is not in release.json (known: $(jq -r '.boards | keys | join(", ")' release.json))"; exit 1
          fi
          echo "board=$board" >> "$GITHUB_OUTPUT"
          echo "version=${version%%-beta*}" >> "$GITHUB_OUTPUT"
          echo "fullversion=$version" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "sketch=$(jq -r .sketch <<< "$entry")" >> "$GITHUB_OUTPUT"
          echo "profile=$(jq -r .profile <<< "$entry")" >> "$GITHUB_OUTPUT"
          echo "ota=$(jq -r '.ota // false' <<< "$entry")" >> "$GITHUB_OUTPUT"
          echo "flags=$(jq -r '.flags // ""' <<< "$entry")" >> "$GITHUB_OUTPUT"

      - uses: arduino/setup-arduino-cli@v2

      - name: Build firmware
        run: |
          flags="${{ steps.meta.outputs.flags }}"
          arduino-cli compile --profile "${{ steps.meta.outputs.profile }}" ${flags:+--build-property "compiler.cpp.extra_flags=$flags"} --output-dir out "${{ steps.meta.outputs.sketch }}"
          ls -l out
          name="MotoButtons2-${{ steps.meta.outputs.board }}-${{ steps.meta.outputs.fullversion }}"
          mkdir dist
          if ls out/*.ino.zip >/dev/null 2>&1; then
            cp out/*.ino.zip "dist/$name.zip"
            cp out/*.ino.hex "dist/$name.hex"
            image=$(ls out/*.ino.elf)
          else
            cp out/*.ino.bin "dist/$name.bin"
            image="dist/$name.bin"
          fi
          # The version in the code must match the tag.
          built=$(grep -ao 'MBFWVER=[0-9A-Za-z.-]*' "$image" | head -1 | cut -d= -f2)
          if [ "$built" != "${{ steps.meta.outputs.fullversion }}" ]; then
            echo "::error::The firmware says version '$built', the tag says '${{ steps.meta.outputs.fullversion }}'"; exit 1
          fi

      - name: Add to the site (gh-pages)
        if: ${{ steps.meta.outputs.ota == 'true' }}
        run: |
          git fetch origin gh-pages
          git worktree add pages origin/gh-pages
          python3 .github/scripts/publish.py --site pages \
            --firmware "dist/MotoButtons2-${{ steps.meta.outputs.board }}-${{ steps.meta.outputs.fullversion }}.bin" \
            --channel "${{ steps.meta.outputs.channel }}" \
            --expect-board "${{ steps.meta.outputs.board }}" --expect-version "${{ steps.meta.outputs.fullversion }}"
          cd pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish ${GITHUB_REF_NAME}"
          git push origin HEAD:gh-pages

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ steps.meta.outputs.channel == 'beta' }}
          files: dist/*

  app:
    if: ${{ startsWith(github.ref_name, 'app/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Signing key from secrets
        run: |
          mkdir -p ~/.motobuttons
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > ~/.motobuttons/release.jks
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=motobuttons\nkeyPassword=%s\n' \
            "$HOME/.motobuttons/release.jks" "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            > ~/.motobuttons/keystore.properties

      - name: Build app
        working-directory: Apps/Android
        run: chmod +x gradlew && ./gradlew assembleRelease

      - name: Add to the site (gh-pages)
        run: |
          git fetch origin gh-pages
          git worktree add pages origin/gh-pages
          python3 .github/scripts/publish.py --site pages --app Apps/Android/app/build/outputs/apk/release/app-release.apk
          cd pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish ${GITHUB_REF_NAME}"
          git push origin HEAD:gh-pages

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: Apps/Android/app/build/outputs/apk/release/app-release.apk
