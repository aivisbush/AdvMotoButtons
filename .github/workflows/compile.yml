name: Compile firmware

on:
  push:
    paths:
      - "ArduinoCode/**"
      - "release.json"
      - ".github/workflows/compile.yml"
  pull_request:
    paths:
      - "ArduinoCode/**"
      - "release.json"
      - ".github/workflows/compile.yml"
  workflow_dispatch:

jobs:
  boards:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: echo "matrix=$(jq -c '[.boards | to_entries[] | {board: .key, sketch: .value.sketch, profile: .value.profile, flags: (.value.flags // "")}]' release.json)" >> "$GITHUB_OUTPUT"

  compile:
    needs: boards
    name: ${{ matrix.board }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.boards.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Compile
        run: |
          flags="${{ matrix.flags }}"
          arduino-cli compile --profile "${{ matrix.profile }}" --warnings default ${flags:+--build-property "compiler.cpp.extra_flags=$flags"} "${{ matrix.sketch }}"
