name: Compile firmware

on:
  push:
    paths:
      - "ArduinoCode/**"
      - ".github/workflows/compile.yml"
  pull_request:
    paths:
      - "ArduinoCode/**"
      - ".github/workflows/compile.yml"
  workflow_dispatch:

jobs:
  compile:
    name: XIAO_ESP32C3 (esp32 3.3.8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile sketch
        uses: arduino/compile-sketches@v1
        with:
          fqbn: esp32:esp32:XIAO_ESP32C3
          platforms: |
            - name: esp32:esp32
              source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
              version: 3.3.8
          libraries: |
            - name: NimBLE-Arduino
              version: 2.5.0
            - name: U8g2
              version: 2.36.19
          sketch-paths: |
            - ArduinoCode/MotoButtons2
          enable-warnings-report: true
          verbose: false
